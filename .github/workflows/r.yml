name: R Package CI for Windows
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      
      - name: Cache JAGS installation
        id: cache-jags
        uses: actions/cache@v4
        with:
          path: C:\Program Files\JAGS
          key: jags-4.3.0-windows
      
      - name: Download and install JAGS
        if: steps.cache-jags.outputs.cache-hit != 'true'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          
          # 嘗試多個鏡像源
          $mirrors = @(
            "https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Windows/JAGS-4.3.0.exe",
            "https://versaweb.dl.sourceforge.net/project/mcmc-jags/JAGS/4.x/Windows/JAGS-4.3.0.exe",
            "https://managedway.dl.sourceforge.net/project/mcmc-jags/JAGS/4.x/Windows/JAGS-4.3.0.exe"
          )
          
          $output = "JAGS-4.3.0.exe"
          $downloaded = $false
          
          foreach ($url in $mirrors) {
            try {
              Write-Output "Trying mirror: $url"
              Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing -TimeoutSec 60
              
              $fileSize = (Get-Item $output).Length / 1MB
              Write-Output "Downloaded file size: $fileSize MB"
              
              if ($fileSize -gt 10) {
                Write-Output "Download successful!"
                $downloaded = $true
                break
              } else {
                Write-Output "File too small, trying next mirror..."
                Remove-Item $output -ErrorAction SilentlyContinue
              }
            } catch {
              Write-Output "Failed with this mirror: $_"
              Remove-Item $output -ErrorAction SilentlyContinue
            }
          }
          
          if (-not $downloaded) {
            Write-Error "All download attempts failed"
            exit 1
          }
          
          Write-Output "Installing JAGS..."
          Start-Process -FilePath ".\$output" -ArgumentList '/S' -NoNewWindow -Wait
          Write-Output "JAGS installed successfully"
          
          # 驗證安裝
          if (Test-Path "C:\Program Files\JAGS\JAGS-4.3.0") {
            Write-Output "JAGS installation verified"
          } else {
            Write-Error "JAGS installation failed"
            exit 1
          }
        shell: powershell
      
      - name: Configure JAGS environment
        run: |
          $jagsPath = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin"
          echo $jagsPath >> $env:GITHUB_PATH
          
          if (Test-Path $jagsPath) {
            Write-Output "JAGS DLLs:"
            Get-ChildItem "$jagsPath\*.dll" | Select-Object Name, Length
          }
        shell: powershell
      
      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "devtools"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Install basicspace
        run: |
          remotes::install_github("cran/basicspace", force = TRUE)
        shell: Rscript {0}
      
      - name: Test rjags loading
        run: |
          # 設定 PATH
          jags_bin <- "C:/Program Files/JAGS/JAGS-4.3.0/x64/bin"
          Sys.setenv(PATH = paste(jags_bin, Sys.getenv("PATH"), sep = ";"))
          
          cat("PATH:", Sys.getenv("PATH"), "\n\n")
          
          # 嘗試載入
          tryCatch({
            library(rjags)
            cat("SUCCESS: rjags loaded\n")
            cat("JAGS version:", jags.version(), "\n")
          }, error = function(e) {
            cat("ERROR:", conditionMessage(e), "\n\n")
            
            # 診斷資訊
            cat("Trying to manually load jags.dll...\n")
            jags_dll <- file.path(jags_bin, "jags.dll")
            
            if (file.exists(jags_dll)) {
              tryCatch({
                dyn.load(jags_dll)
                cat("Manually loaded jags.dll\n")
                library(rjags)
                cat("SUCCESS after manual load\n")
              }, error = function(e2) {
                cat("Manual load also failed:", conditionMessage(e2), "\n")
                stop("Cannot load rjags")
              })
            } else {
              cat("jags.dll not found at:", jags_dll, "\n")
              stop("JAGS DLL missing")
            }
          })
        shell: Rscript {0}
      
      - name: Check package
        run: |
          jags_bin <- "C:/Program Files/JAGS/JAGS-4.3.0/x64/bin"
          Sys.setenv(PATH = paste(jags_bin, Sys.getenv("PATH"), sep = ";"))
          rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")
        shell: Rscript {0}
      
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: check
      
      - name: Test package
        run: |
          jags_bin <- "C:/Program Files/JAGS/JAGS-4.3.0/x64/bin"
          Sys.setenv(PATH = paste(jags_bin, Sys.getenv("PATH"), sep = ";"))
          if (file.exists("tests")) {
            devtools::test()
          } else {
            message("No tests directory found")
          }
        shell: Rscript {0}