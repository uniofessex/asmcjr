name: R Package CI for Windows
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      
      - name: Download and install JAGS
        run: |
          curl.exe -L -o JAGS-4.3.0.exe https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.0.exe/download
          if (Test-Path -Path ".\JAGS-4.3.0.exe") {
            Start-Process -FilePath ".\JAGS-4.3.0.exe" -ArgumentList '/S' -NoNewWindow -Wait
            Write-Output "JAGS installed successfully"
          } else {
            Write-Error "Failed to download JAGS installer"
            exit 1
          }
        shell: powershell
      
      - name: Set up JAGS environment
        run: |
          echo "JAGS_HOME=C:/Program Files/JAGS/JAGS-4.3.0" >> $env:GITHUB_ENV
          echo "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin" >> $env:GITHUB_PATH
          echo "JAGS_ROOT=C:/Program Files/JAGS/JAGS-4.3.0" >> $env:GITHUB_ENV
        shell: powershell
      
      - name: Verify JAGS installation
        run: |
          Write-Output "JAGS installation check:"
          Get-ChildItem "C:\Program Files\JAGS\JAGS-4.3.0\x64" -Recurse -Include *.dll | Select-Object FullName
          Write-Output "`nJAGS include files:"
          if (Test-Path "C:\Program Files\JAGS\JAGS-4.3.0\x64\include") {
            Get-ChildItem "C:\Program Files\JAGS\JAGS-4.3.0\x64\include" -Recurse -Include *.h
          }
          Write-Output "`nJAGS library files:"
          if (Test-Path "C:\Program Files\JAGS\JAGS-4.3.0\x64\lib") {
            Get-ChildItem "C:\Program Files\JAGS\JAGS-4.3.0\x64\lib"
          }
        shell: powershell
      
      - name: Install R dependencies (without rjags)
        run: |
          install.packages(c("remotes", "rcmdcheck", "devtools", "coda"))
        shell: Rscript {0}
      
      - name: Install rjags from source
        run: |
          $env:JAGS_HOME = "C:/Program Files/JAGS/JAGS-4.3.0"
          $env:JAGS_ROOT = "C:/Program Files/JAGS/JAGS-4.3.0"
          $env:PATH = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin;$env:PATH"
          $makevarsContent = "JAGS_ROOT = C:/PROGRA~1/JAGS/JAGS-4.3.0`nPKG_CPPFLAGS = -I`$(JAGS_ROOT)/x64/include`nPKG_LIBS = -L`$(JAGS_ROOT)/x64/bin -L`$(JAGS_ROOT)/x64/lib -ljags"
          New-Item -Path "$env:USERPROFILE\.R" -ItemType Directory -Force
          Set-Content -Path "$env:USERPROFILE\.R\Makevars.win" -Value $makevarsContent
          Write-Output "Makevars.win content:"
          Get-Content "$env:USERPROFILE\.R\Makevars.win"
          Rscript -e "install.packages('rjags', type='source', INSTALL_opts='--no-multiarch')"
        shell: powershell
      
      - name: Copy JAGS DLLs to R library
        run: |
          $rjagsDir = "D:\a\_temp\Library\rjags\libs\x64"
          $jagsBin = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin"
          if (Test-Path $rjagsDir) {
            Write-Output "Copying JAGS DLLs to rjags directory..."
            Copy-Item "$jagsBin\*.dll" -Destination $rjagsDir -Force
            Write-Output "DLLs in rjags directory:"
            Get-ChildItem $rjagsDir\*.dll
          }
        shell: powershell
      
      - name: Verify rjags can load
        run: |
          library(rjags)
          cat('rjags loaded successfully\n')
          cat('JAGS version:', jags.version(), '\n')
        shell: Rscript {0}
      
      - name: Install remaining dependencies
        run: |
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Install basicspace from GitHub
        run: |
          remotes::install_github("cran/basicspace", force = TRUE)
        shell: Rscript {0}
      
      - name: Check package
        run: |
          rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")
        shell: Rscript {0}
      
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: check
      
      - name: Test package (optional)
        run: |
          if (file.exists("tests")) {
            devtools::test()
          } else {
            message("No tests directory found, skipping tests")
          }
        shell: Rscript {0}