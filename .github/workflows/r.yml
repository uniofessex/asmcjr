name: R Package CI for Windows
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      
      - name: Install system dependencies including JAGS
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
            any::remotes
            any::rjags
            github::cran/basicspace
          needs: check
      
      - name: Verify JAGS and rjags
        run: |
          cat("Testing rjags installation...\n")
          tryCatch({
            library(rjags)
            cat("SUCCESS: rjags loaded\n")
            cat("JAGS version:", jags.version(), "\n")
          }, error = function(e) {
            cat("ERROR: rjags failed to load\n")
            cat("Error message:", conditionMessage(e), "\n")
            cat("\nSystem info:\n")
            print(sessionInfo())
            stop("rjags installation failed")
          })
        shell: Rscript {0}
      
      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
      
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: check