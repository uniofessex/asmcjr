name: R Package CI for Windows
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      
      - name: Download and install JAGS 4.3.2
        run: |
          # 使用 JAGS 4.3.2 (更新的版本，可能與 rjags 二進位檔更相容)
          $url = "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.2.exe/download"
          curl.exe -L -o JAGS-4.3.2.exe $url
          if (Test-Path ".\JAGS-4.3.2.exe") {
            Start-Process -FilePath ".\JAGS-4.3.2.exe" -ArgumentList '/S' -NoNewWindow -Wait
            Write-Output "JAGS 4.3.2 installed successfully"
          } else {
            Write-Error "Failed to download JAGS"
            exit 1
          }
        shell: powershell
      
      - name: Configure JAGS environment
        run: |
          $jagsPath = "C:\Program Files\JAGS\JAGS-4.3.2\x64\bin"
          echo $jagsPath >> $env:GITHUB_PATH
          Write-Output "JAGS bin added to PATH for next steps"
          
          # 立即為當前 session 設定
          $env:Path = "$jagsPath;$env:Path"
          
          # 驗證安裝
          Write-Output "`nJAGS DLLs:"
          Get-ChildItem "$jagsPath\*.dll" | Select-Object Name, Length
        shell: powershell
      
      - name: Create R environment setup script
        run: |
          $script = @'
          # 確保 JAGS 在 PATH 中
          jags_path <- "C:/Program Files/JAGS/JAGS-4.3.2/x64/bin"
          current_path <- Sys.getenv("PATH")
          if (!grepl(jags_path, current_path, fixed = TRUE)) {
            Sys.setenv(PATH = paste(jags_path, current_path, sep = ";"))
          }
          '@
          
          New-Item -Path ".github" -ItemType Directory -Force
          Set-Content -Path ".github/setup.R" -Value $script
          
          Write-Output "Setup script created"
          Get-Content ".github/setup.R"
        shell: powershell
      
      - name: Install R dependencies
        run: |
          source(".github/setup.R")
          install.packages(c("remotes", "rcmdcheck", "devtools"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Install basicspace
        run: |
          source(".github/setup.R")
          remotes::install_github("cran/basicspace", force = TRUE)
        shell: Rscript {0}
      
      - name: Verify rjags with diagnostics
        run: |
          source(".github/setup.R")
          
          cat("Current PATH:\n")
          cat(Sys.getenv("PATH"), "\n\n")
          
          cat("Attempting to load rjags...\n")
          result <- tryCatch({
            library(rjags)
            cat("SUCCESS: rjags loaded\n")
            cat("JAGS version:", jags.version(), "\n")
            TRUE
          }, error = function(e) {
            cat("ERROR loading rjags:\n")
            cat(conditionMessage(e), "\n")
            
            # 嘗試診斷
            cat("\nDiagnostics:\n")
            cat("rjags.dll location:\n")
            rjags_path <- system.file("libs/x64/rjags.dll", package = "rjags")
            cat(rjags_path, "\n")
            
            if (file.exists(rjags_path)) {
              cat("rjags.dll exists\n")
            }
            
            FALSE
          })
          
          if (!result) {
            stop("rjags failed to load")
          }
        shell: Rscript {0}
      
      - name: Check package
        run: |
          source(".github/setup.R")
          rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")
        shell: Rscript {0}
      
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: check
      
      - name: Test package
        run: |
          source(".github/setup.R")
          if (file.exists("tests")) {
            devtools::test()
          } else {
            message("No tests directory found")
          }
        shell: Rscript {0}