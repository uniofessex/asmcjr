name: R Package CI for Windows
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      
      - name: Download and install JAGS
        run: |
          # 使用 Invoke-WebRequest 而不是 curl，處理重定向更好
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.0.exe/download"
          $output = "JAGS-4.3.0.exe"
          
          Write-Output "Downloading JAGS..."
          Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing -MaximumRedirection 5
          
          $fileSize = (Get-Item $output).Length / 1MB
          Write-Output "Downloaded file size: $fileSize MB"
          
          if ($fileSize -lt 1) {
            Write-Error "Downloaded file is too small, likely corrupted"
            exit 1
          }
          
          Write-Output "Installing JAGS..."
          Start-Process -FilePath ".\$output" -ArgumentList '/S' -NoNewWindow -Wait
          Write-Output "JAGS installed successfully"
        shell: powershell
      
      - name: Configure JAGS environment
        run: |
          $jagsPath = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin"
          echo $jagsPath >> $env:GITHUB_PATH
          
          # 驗證安裝
          if (Test-Path $jagsPath) {
            Write-Output "JAGS installation verified"
            Get-ChildItem "$jagsPath\*.dll" | Select-Object Name, Length
          } else {
            Write-Error "JAGS installation not found"
            exit 1
          }
        shell: powershell
      
      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "devtools"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Install basicspace
        run: |
          remotes::install_github("cran/basicspace", force = TRUE)
        shell: Rscript {0}
      
      - name: Test rjags with PATH setup
        run: |
          # 在 R 內部設定 PATH
          jags_bin <- "C:/Program Files/JAGS/JAGS-4.3.0/x64/bin"
          old_path <- Sys.getenv("PATH")
          Sys.setenv(PATH = paste(jags_bin, old_path, sep = ";"))
          
          cat("Attempting to load rjags...\n")
          tryCatch({
            library(rjags)
            cat("SUCCESS: rjags loaded\n")
            cat("JAGS version:", jags.version(), "\n")
          }, error = function(e) {
            cat("ERROR:", conditionMessage(e), "\n")
            cat("\nAttempting to load dependencies manually...\n")
            
            # 嘗試手動載入 JAGS DLL
            jags_dll <- file.path(jags_bin, "jags.dll")
            if (file.exists(jags_dll)) {
              cat("Found jags.dll at:", jags_dll, "\n")
              dyn.load(jags_dll)
              cat("Manually loaded jags.dll\n")
              
              # 再次嘗試載入 rjags
              library(rjags)
              cat("SUCCESS after manual DLL load\n")
            } else {
              stop("Cannot find jags.dll")
            }
          })
        shell: Rscript {0}
      
      - name: Check package
        run: |
          # 設定 PATH
          jags_bin <- "C:/Program Files/JAGS/JAGS-4.3.0/x64/bin"
          Sys.setenv(PATH = paste(jags_bin, Sys.getenv("PATH"), sep = ";"))
          
          rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")
        shell: Rscript {0}
      
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: check
      
      - name: Test package
        run: |
          jags_bin <- "C:/Program Files/JAGS/JAGS-4.3.0/x64/bin"
          Sys.setenv(PATH = paste(jags_bin, Sys.getenv("PATH"), sep = ";"))
          
          if (file.exists("tests")) {
            devtools::test()
          } else {
            message("No tests directory found")
          }
        shell: Rscript {0}