name: R Package CI for Windows
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      JAGS_HOME: "C:/Program Files/JAGS/JAGS-4.3.0"
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      
      - name: Download and install JAGS
        run: |
          curl.exe -L -o JAGS-4.3.0.exe https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.0.exe/download
          if (Test-Path -Path ".\JAGS-4.3.0.exe") {
            Start-Process -FilePath ".\JAGS-4.3.0.exe" -ArgumentList '/S' -NoNewWindow -Wait
            Write-Output "JAGS installed successfully"
          } else {
            Write-Error "Failed to download JAGS installer"
            exit 1
          }
        shell: powershell
      
      - name: Set JAGS environment variables
        run: |
          echo "JAGS_HOME=C:/Program Files/JAGS/JAGS-4.3.0" >> $env:GITHUB_ENV
          echo "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin" >> $env:GITHUB_PATH
          # 將 JAGS bin 加入當前 session 的 PATH
          $env:Path = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin;$env:Path"
        shell: powershell
      
      - name: Verify JAGS installation
        run: |
          $env:Path = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin;$env:Path"
          if (Test-Path "C:\Program Files\JAGS\JAGS-4.3.0") {
            Write-Output "JAGS 4.3.0 is installed"
            Write-Output "JAGS_HOME: $env:JAGS_HOME"
            Write-Output "Checking JAGS bin directory:"
            Get-ChildItem "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin"
            Write-Output "`nChecking for JAGS DLL files:"
            Get-ChildItem "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin\*.dll"
          } else {
            Write-Error "JAGS installation directory not found"
            exit 1
          }
        shell: powershell
      
      - name: Install R dependencies (except rjags)
        run: |
          install.packages(c("remotes", "rcmdcheck", "devtools", "coda"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Install rjags with JAGS in PATH
        run: |
          $env:Path = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin;$env:Path"
          $env:JAGS_HOME = "C:/Program Files/JAGS/JAGS-4.3.0"
          Rscript -e "install.packages('rjags', type='binary')"
        shell: powershell
      
      - name: Verify rjags installation
        run: |
          $env:Path = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin;$env:Path"
          $env:JAGS_HOME = "C:/Program Files/JAGS/JAGS-4.3.0"
          Rscript -e "library(rjags); cat('rjags loaded successfully\n')"
        shell: powershell
      
      - name: Install basicspace from GitHub
        run: |
          remotes::install_github("cran/basicspace", force = TRUE)
        shell: Rscript {0}
      
      - name: Check package
        run: |
          $env:Path = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin;$env:Path"
          $env:JAGS_HOME = "C:/Program Files/JAGS/JAGS-4.3.0"
          Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual', '--as-cran'), error_on = 'error', check_dir = 'check')"
        shell: powershell
      
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: check
      
      - name: Test package (optional)
        run: |
          $env:Path = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin;$env:Path"
          Rscript -e "if (file.exists('tests')) { devtools::test() } else { message('No tests directory found, skipping tests') }"
        shell: powershell