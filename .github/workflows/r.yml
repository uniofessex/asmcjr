name: R Package CI for Windows
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      
      - name: Download and install JAGS
        run: |
          curl.exe -L -o JAGS-4.3.0.exe https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.0.exe/download
          Start-Process -FilePath ".\JAGS-4.3.0.exe" -ArgumentList '/S' -NoNewWindow -Wait
          Write-Output "JAGS installed"
        shell: powershell
      
      - name: Add JAGS to PATH permanently
        run: |
          $jagsPath = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin"
          $currentPath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          [Environment]::SetEnvironmentVariable("Path", "$jagsPath;$currentPath", "Machine")
          $env:Path = "$jagsPath;$env:Path"
          Write-Output "JAGS added to PATH"
        shell: powershell
      
      - name: Verify JAGS
        run: |
          $env:Path = "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin;$env:Path"
          Get-ChildItem "C:\Program Files\JAGS\JAGS-4.3.0\x64\bin\*.dll"
        shell: powershell
      
      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "devtools"))
          remotes::install_deps(dependencies = TRUE)
          remotes::install_github("cran/basicspace", force = TRUE)
        shell: Rscript {0}
      
      - name: Test rjags loading
        run: |
          tryCatch({
            library(rjags)
            cat("rjags loaded successfully\n")
          }, error = function(e) {
            cat("rjags load failed, trying to reinstall...\n")
            install.packages("rjags", type = "binary")
            library(rjags)
          })
        shell: Rscript {0}
      
      - name: Check package
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")
        shell: Rscript {0}
      
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: check

