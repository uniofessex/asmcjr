name: R Package CI for macOS
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      
      - name: Install system dependencies
        run: |
          brew install jags gcc
          which gfortran
          gfortran --version
      
      - name: Verify JAGS installation
        run: |
          which jags
          ls -la /usr/local/bin/jags* 2>/dev/null || ls -la /opt/homebrew/bin/jags* 2>/dev/null || echo "JAGS binary location check"
          echo "JAGS installed successfully"
      
      - name: Configure R for gfortran
        run: |
          mkdir -p ~/.R
          echo "FC = $(which gfortran)" >> ~/.R/Makevars
          echo "F77 = $(which gfortran)" >> ~/.R/Makevars
          GFORTRAN_LIB=$(dirname $(gfortran -print-file-name=libgfortran.dylib))
          echo "FLIBS = -L${GFORTRAN_LIB} -lgfortran -lquadmath -lm" >> ~/.R/Makevars
          cat ~/.R/Makevars
      
      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "devtools"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Install basicspace from GitHub
        run: |
          remotes::install_github("cran/basicspace", force = TRUE)
        shell: Rscript {0}
      
      - name: Verify rjags installation
        run: |
          library(rjags)
          cat('rjags loaded successfully\n')
          cat('JAGS version:', jags.version(), '\n')
        shell: Rscript {0}
      
      - name: Check package
        run: |
          rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")
        shell: Rscript {0}
          
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-results
          path: check
      
      - name: Test package (optional)
        run: |
          if (file.exists("tests")) {
            devtools::test()
          } else {
            message("No tests directory found, skipping tests")
          }
        shell: Rscript {0}
