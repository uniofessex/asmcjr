name: R Package CI for macOS
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      
      - name: Install system dependencies
        run: |
          brew install jags gcc
          which gfortran
          gfortran --version
      
      - name: Set up JAGS environment
        run: |
          # Determine Homebrew prefix (differs between Intel and Apple Silicon)
          BREW_PREFIX=$(brew --prefix)
          echo "Homebrew prefix: $BREW_PREFIX"
          
          # Add JAGS library path to environment
          echo "JAGS_LIBDIR=${BREW_PREFIX}/lib" >> $GITHUB_ENV
          echo "JAGS_INCLUDEDIR=${BREW_PREFIX}/include" >> $GITHUB_ENV
          
          # Add to dyld library path for runtime
          echo "DYLD_FALLBACK_LIBRARY_PATH=${BREW_PREFIX}/lib:$DYLD_FALLBACK_LIBRARY_PATH" >> $GITHUB_ENV
          
          # Verify JAGS installation
          ls -la ${BREW_PREFIX}/lib/libjags*
          ls -la ${BREW_PREFIX}/bin/jags*
      
      - name: Configure R for gfortran
        run: |
          mkdir -p ~/.R
          echo "FC = $(which gfortran)" >> ~/.R/Makevars
          echo "F77 = $(which gfortran)" >> ~/.R/Makevars
          GFORTRAN_LIB=$(dirname $(gfortran -print-file-name=libgfortran.dylib))
          echo "FLIBS = -L${GFORTRAN_LIB} -lgfortran -lquadmath -lm" >> ~/.R/Makevars
          cat ~/.R/Makevars
      
      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "devtools"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Install basicspace from GitHub
        run: |
          remotes::install_github("cran/basicspace", force = TRUE)
        shell: Rscript {0}
      
      - name: Configure and install rjags
        run: |
          BREW_PREFIX=$(brew --prefix)
          install.packages("rjags", 
                          type = "source",
                          configure.args = paste0("--with-jags-prefix=", BREW_PREFIX))
        shell: Rscript {0}
      
      - name: Verify rjags installation
        run: |
          library(rjags)
          cat('rjags loaded successfully\n')
          cat('JAGS version:', jags.version(), '\n')
        shell: Rscript {0}
      
      - name: Check package
        run: |
          rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")
        shell: Rscript {0}
          
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-results
          path: check
      
      - name: Test package (optional)
        run: |
          if (file.exists("tests")) {
            devtools::test()
          } else {
            message("No tests directory found, skipping tests")
          }
        shell: Rscript {0}
